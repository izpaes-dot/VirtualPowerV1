name: Build Virtual Power V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Compilar APK
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        run: |
          echo "Arquivos gerados:"
          find app/build/outputs -type f -maxdepth 5
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPowerV1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
