name: Build Virtual Power V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Compilar APK
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verificar APK detalhadamente
        run: |
          echo "======================================"
          echo "ARQUIVO APK"
          echo "======================================"

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "======================================"
          echo "TAMANHO EM BYTES"
          echo "======================================"

          stat -c%s app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "======================================"
          echo "CONTEUDO DO APK"
          echo "======================================"

          unzip -l app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "======================================"
          echo "CLASSES DEX"
          echo "======================================"

          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "classes.*\.dex" || true

          echo ""
          echo "======================================"
          echo "ANDROID MANIFEST"
          echo "======================================"

          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep AndroidManifest.xml || true

          echo ""
          echo "======================================"
          echo "RECURSOS"
          echo "======================================"

          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep resources.arsc || true

          echo ""
          echo "======================================"
          echo "TESTE FINAL"
          echo "======================================"

          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK GERADO COM SUCESSO"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPowerV1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
